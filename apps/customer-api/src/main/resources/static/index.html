<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo</title>
  <style>
    :root {
      --bg: #0f0f10;
      --surface: #1a1a1c;
      --border: #2c2c2f;
      --text: #e7e7e8;
      --muted: #8a8a8f;
      --accent: #6d8eff;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      line-height: 1.5;
    }
    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    h1 { font-size: 28px; margin: 0; letter-spacing: -0.5px; }
    .sub { color: var(--muted); font-size: 13px; }

    .composer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 28px;
    }
    textarea {
      width: 100%;
      min-height: 84px;
      resize: vertical;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }
    textarea::placeholder { color: var(--muted); }
    .composer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .counter { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .counter.warn { color: #ffb84d; }
    .counter.over { color: var(--danger); }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .feed-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .feed-head h2 { font-size: 16px; margin: 0; color: var(--muted); font-weight: 600; }
    .refresh {
      background: none;
      color: var(--muted);
      padding: 4px 8px;
      font-size: 13px;
      font-weight: 500;
    }

    .post {
      border-bottom: 1px solid var(--border);
      padding: 14px 4px;
    }
    .post-meta {
      display: flex;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .author { font-weight: 600; font-size: 14px; }
    .time { color: var(--muted); font-size: 12px; }
    .post-content { white-space: pre-wrap; word-break: break-word; }

    .follow {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 28px;
    }
    .follow h2 { font-size: 16px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
    .follow-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px;
    }
    .follow-row label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }
    .follow-row input {
      width: 110px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      padding: 7px 10px;
      outline: none;
    }
    .follow-row input:focus { border-color: var(--accent); }
    .unfollow {
      background: none;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .follow-result { margin-top: 10px; font-size: 14px; color: var(--muted); min-height: 21px; }
    .follow-result.ok { color: var(--accent); }
    .follow-result.fail { color: var(--danger); }

    .empty, .error {
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
      font-size: 14px;
    }
    .error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Echo</h1>
      <span class="sub">텍스트 한 줄, 그대로 울림</span>
    </header>

    <section class="composer">
      <textarea id="content" placeholder="지금 무슨 생각을 하고 있나요?" maxlength="280"></textarea>
      <div class="composer-bar">
        <span id="counter" class="counter">0 / 280</span>
        <button id="submit" disabled>게시</button>
      </div>
    </section>

    <section class="follow">
      <h2>팔로우</h2>
      <div class="follow-row">
        <label>내 유저 ID
          <input id="follow-me" type="number" min="1" value="1" />
        </label>
        <label>대상 유저 ID
          <input id="follow-target" type="number" min="1" placeholder="예: 2" />
        </label>
        <button id="follow-btn">팔로우</button>
        <button id="unfollow-btn" class="unfollow">언팔로우</button>
      </div>
      <div id="follow-result" class="follow-result" role="status"></div>
    </section>

    <div class="feed-head">
      <h2>타임라인</h2>
      <button id="refresh" class="refresh">새로고침</button>
    </div>
    <div id="feed"></div>
  </div>

  <script>
    const MAX = 280;
    const $content = document.getElementById("content");
    const $counter = document.getElementById("counter");
    const $submit = document.getElementById("submit");
    const $feed = document.getElementById("feed");
    const $refresh = document.getElementById("refresh");

    // 280자 카운터 + 게시 버튼 활성화 제어
    function updateCounter() {
      const len = $content.value.length;
      $counter.textContent = `${len} / ${MAX}`;
      $counter.classList.toggle("warn", len > MAX - 40 && len <= MAX);
      $counter.classList.toggle("over", len > MAX);
      $submit.disabled = len === 0 || len > MAX;
    }

    // ApiResponse → data 추출 (실패 시 throw)
    async function unwrap(res) {
      let body = null;
      try { body = await res.json(); } catch (_) { /* 본문 없음 */ }
      if (!res.ok || (body && body.success === false)) {
        const msg = (body && body.message) || `요청 실패 (${res.status})`;
        throw new Error(msg);
      }
      return body ? body.data : null;
    }

    function formatTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleString("ko-KR", {
        month: "long", day: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }

    function renderFeed(items) {
      if (!items || items.length === 0) {
        $feed.innerHTML = `<div class="empty">아직 글이 없어요. 첫 글을 남겨보세요.</div>`;
        return;
      }
      // 응답이 이미 최신순이지만, 안전하게 createdAt 기준 내림차순 정렬
      const sorted = [...items].sort(
        (a, b) => new Date(b.createdAt) - new Date(a.createdAt)
      );
      $feed.innerHTML = sorted.map(p => `
        <article class="post">
          <div class="post-meta">
            <span class="author">@user${escapeHtml(String(p.authorId))}</span>
            <span class="time">${escapeHtml(formatTime(p.createdAt))}</span>
          </div>
          <div class="post-content">${escapeHtml(p.content)}</div>
        </article>
      `).join("");
    }

    async function loadTimeline() {
      try {
        const res = await fetch("/timeline");
        const data = await unwrap(res);
        renderFeed(data);
      } catch (e) {
        $feed.innerHTML = `<div class="error">타임라인을 불러오지 못했어요: ${escapeHtml(e.message)}</div>`;
      }
    }

    async function submitPost() {
      const content = $content.value.trim();
      if (!content || content.length > MAX) return;
      $submit.disabled = true;
      try {
        const res = await fetch("/posts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content })
        });
        await unwrap(res);
        $content.value = "";
        updateCounter();
        await loadTimeline();
      } catch (e) {
        alert("게시 실패: " + e.message);
        $submit.disabled = false;
      }
    }

    const $followMe = document.getElementById("follow-me");
    const $followTarget = document.getElementById("follow-target");
    const $followBtn = document.getElementById("follow-btn");
    const $unfollowBtn = document.getElementById("unfollow-btn");
    const $followResult = document.getElementById("follow-result");

    // 오류 응답에는 message 가 실리지 않으므로 상태 코드로 안내 문구를 정한다
    const FOLLOW_ERRORS = {
      400: "잘못된 요청이에요. (자기 자신은 팔로우할 수 없어요)",
      404: "유저를 찾을 수 없어요.",
      409: "이미 팔로우 중이에요."
    };

    function showFollowResult(text, ok) {
      $followResult.textContent = text;
      $followResult.classList.toggle("ok", ok);
      $followResult.classList.toggle("fail", !ok);
    }

    // POST /follows/{id} = 팔로우, DELETE /follows/{id} = 언팔로우 (요청자는 X-User-Id 헤더)
    async function requestFollow(method) {
      const me = Number($followMe.value);
      const target = Number($followTarget.value);
      if (!Number.isInteger(me) || me < 1 || !Number.isInteger(target) || target < 1) {
        showFollowResult("유저 ID는 1 이상의 숫자로 입력해 주세요.", false);
        return;
      }
      $followBtn.disabled = $unfollowBtn.disabled = true;
      try {
        const res = await fetch(`/follows/${target}`, {
          method,
          headers: { "X-User-Id": String(me) }
        });
        let body = null;
        try { body = await res.json(); } catch (_) { /* 본문 없음 */ }
        if (!res.ok || (body && body.success === false)) {
          const msg = (body && body.message) || FOLLOW_ERRORS[res.status] || "요청에 실패했어요.";
          showFollowResult(`${msg} (${res.status})`, false);
          return;
        }
        const done = (body && body.message) || (method === "POST" ? "팔로우했습니다." : "언팔로우했습니다.");
        const at = body && body.data && body.data.createdAt ? ` · ${formatTime(body.data.createdAt)}` : "";
        showFollowResult(`@user${me} → @user${target} ${done}${at}`, true);
      } catch (e) {
        showFollowResult("서버에 연결하지 못했어요: " + e.message, false);
      } finally {
        $followBtn.disabled = $unfollowBtn.disabled = false;
      }
    }

    $followBtn.addEventListener("click", () => requestFollow("POST"));
    $unfollowBtn.addEventListener("click", () => requestFollow("DELETE"));

    $content.addEventListener("input", updateCounter);
    // Cmd/Ctrl + Enter 로 빠른 게시
    $content.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") submitPost();
    });
    $submit.addEventListener("click", submitPost);
    $refresh.addEventListener("click", loadTimeline);

    updateCounter();
    loadTimeline();
  </script>
</body>
</html>
