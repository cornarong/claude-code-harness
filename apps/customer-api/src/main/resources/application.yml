spring:
  application:
    name: echo-customer-api

  # PostgreSQL (docker-compose.yml). 접속 정보는 환경변수로 받는다 — 비밀번호는 여기에 적지 않는다.
  # ./gradlew bootRun 은 프로젝트 루트의 .env 를 읽어 환경변수로 넘겨준다.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:echo}
    username: ${POSTGRES_USER:echo}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    hibernate:
      # 스키마는 Flyway(db/migration)가 만든다. Hibernate는 엔티티와 맞는지 검증만 한다.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# Swagger UI — http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info
